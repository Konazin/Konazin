name: Generate GitHub Profile Cards

on:
  workflow_dispatch:

  schedule:
    # Executa diariamente à meia-noite no horário de Fortaleza.
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate profile cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARYGITHUB }}
        with:
          USERNAME: Konazin
          BRANCH_NAME: main
          UTC_OFFSET: -3
          THEME: github_dark
          ANIMATION: load
          DURATION: 2
          AUTO_PUSH: false

      - name: Commit generated cards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile-summary-card-output/

          if git diff --cached --quiet; then
            echo "No card changes to commit."
            exit 0
          fi

          git commit -m "chore: update GitHub profile cards"
          git push
